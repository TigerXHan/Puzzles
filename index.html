<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Puzzle Answer Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a1a2e, #0f3460, #16213e);
      font-family: 'Inter', sans-serif;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      width: 340px;
      text-align: center;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      background: linear-gradient(45deg, #00f5ff, #8a2be2, #ff00c8);
      z-index: -1;
      filter: blur(10px);
      opacity: 0.5;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00f5ff, #8a2be2);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    #feedback {
      margin-top: 18px;
      font-weight: 600;
      min-height: 24px;
      transition: all 0.3s ease;
    }

    .glow-green { color: #00ffae; text-shadow: 0 0 8px #00ffae; }
    .glow-orange { color: #ffb347; text-shadow: 0 0 8px #ffb347; }
    .glow-red { color: #ff4c4c; text-shadow: 0 0 8px #ff4c4c; }

    .footer {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 Puzzle Portal</h2>
    <p>Enter your answer:</p>
    <input type="text" id="answerInput" placeholder="Type your answer in all lowercase...">
    <button onclick="checkAnswer()">Submit</button>
    <div id="feedback"></div>
    <div class="footer">Puzzle Hunt Interface</div>
  </div>

  <script>
    const ANSWERS = {
      "hexahedron": {
        correct: false,
        message: "You're halfway there?"
      },
      "dimensionally": {
        correct: true,
        message: "Congrats! You have solved this puzzle. Stay tuned for future puzzle drops!"
      },
    };

    function normalize(input) {
      return input.trim().toLowerCase();
    }

    function checkAnswer() {
      const input = document.getElementById("answerInput").value;
      const normalized = normalize(input);
      const feedbackDiv = document.getElementById("feedback");

      feedbackDiv.className = "";

      if (normalized in ANSWERS) {
        const result = ANSWERS[normalized];
        feedbackDiv.textContent = result.message;
        feedbackDiv.classList.add(result.correct ? "glow-green" : "glow-orange");
      } else {
        feedbackDiv.textContent = "Incorrect. Try again.";
        feedbackDiv.classList.add("glow-red");
      }
    }

    // Optional: press Enter to submit
    document.getElementById("answerInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        checkAnswer();
      }
    });
  </script>
</body>
</html>
